; UNIHIKER K10 — C/C++ via PlatformIO + DFRobot framework-arduinounihiker
;
; Build:   pio run
; Flash:   pio run -t upload        (USB-C; hold BOOT or press RST to force download mode if needed)
; Monitor: pio device monitor
;
; -DARDUINO_USB_CDC_ON_BOOT=1 / -DARDUINO_USB_MODE=1  ->  Serial = USB-CDC (the USB-C port)
; -DModel=None  ->  don't flash the large speech-recognition model (not needed for the smoke test)

[env:unihiker]
platform  = https://github.com/DFRobot/platform-unihiker.git
board     = unihiker_k10
framework = arduino

; USB-CDC on boot so `Serial` maps to the USB-C port, and flash via esptool over USB.
; WIFI_SSID / WIFI_PASSWORD come from the shell environment, not source —
; export them before `pio run` (see PLAN.md). Never commit real credentials.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -I${sysenv.HOME}/.platformio/packages/framework-arduinounihiker/libraries/WiFi/src
    -I${sysenv.HOME}/.platformio/packages/framework-arduinounihiker/libraries/ESPmDNS/src

; Flash the app into the `factory` partition (0x10000, 5 MB). The framework's
; platformio-build-esp32s3.py already wires up all include paths and links the
; prebuilt board libs (libmodules.a, esp32-camera, esp-dl, esp-sr, LVGL, etc.).
; upload_speed = 921600   ; uncomment/adjust if your cable supports it (default 115200)
