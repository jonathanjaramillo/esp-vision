; UNIHIKER K10 camera pixel-format probe.
;
; Build one format at a time:
;   pio run -e gray
;   pio run -e yuv
;
; Flash and monitor:
;   pio run -e gray -t upload
;   pio device monitor -e gray
;
; The test uses esp_camera directly and intentionally does not initialize the
; display or UNIHIKER camera helper. That makes the capture measurements about
; the sensor/driver path rather than LVGL or the display task.

[env]
platform  = https://github.com/DFRobot/platform-unihiker.git
board     = unihiker_k10
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:gray]
build_flags =
    ${env.build_flags}
    -DCAMERA_TEST_PIXEL_FORMAT=PIXFORMAT_GRAYSCALE

[env:yuv]
build_flags =
    ${env.build_flags}
    -DCAMERA_TEST_PIXEL_FORMAT=PIXFORMAT_YUV422

