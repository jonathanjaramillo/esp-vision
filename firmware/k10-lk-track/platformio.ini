; UNIHIKER K10 — FAST-9 corners + pyramidal Lucas-Kanade tracking (C/C++,
; PlatformIO + DFRobot framework-arduinounihiker)
;
; Build:   pio run
; Flash:   pio run -t upload        (USB-C; hold BOOT or press RST if needed)
; Monitor: pio device monitor
;
; Camera: GC2145 QVGA (240x320 portrait) raw RGB565 via register_camera() —
; same pattern as k10-fast-corners, with a queue owned by this project.
; Display: ILI9341 240x320 portrait via LVGL canvas (full-frame blit, at
; runtime toggled off with 's' / a long button press to reclaim the SPI flush).
; Streams LK tracks (UDP :5007) + accelerometer (UDP :5006) to a host — same
; pattern as k10-fast-corners' ORB stream (see PLAN.md).
; No speech/AI model is flashed (no `Model` flag at all — do NOT add "-DModel=None").

[platformio]
; Default build is the stock packaged driver. Wide-FOV test envs override the
; GC2145 window via -DGC2145_FOV_MODE (see ../../lib/gc2145wide/gc2145_wide.cpp):
;   0 stock QVGA (centered 480x640 window, 1/2)
;   1 wide QVGA (centered 720x960 PORTRAIT window, 1/3)
;   2 sensor 1/4 (1280x960 LANDSCAPE window)
;   3 full sensor (1600x1200, 1/5)
; The landscape modes need the runtime rotation path in src/main.cpp.
default_envs = unihiker

[env]
platform  = https://github.com/DFRobot/platform-unihiker.git
board     = unihiker_k10
framework = arduino

; Shared modules live in ../../lib (fastcorner, lktrack, k10image, k10stream,
; gc2145wide) — PlatformIO auto-discovers anything under lib_extra_dirs the
; same way it does the project's own lib/.
lib_extra_dirs = ../../lib

; gc2145wide is never #included (it hooks the camera driver via g_sensors, a
; linker-visible symbol table, not a call from src/) so the LDF's dependency
; chain scan can't discover it — force it into the link.
lib_deps = gc2145wide

; The archive patch renames the packaged GC2145 entry point so
; lib/gc2145wide/gc2145_wide.cpp can wrap it and rewrite the sensor window per
; FOV mode. Shared with k10-fast-corners — see ../tools/patch_camera_archive.py.
extra_scripts = pre:../tools/patch_camera_archive.py

; USB-CDC on boot so `Serial` maps to the USB-C port, flash via esptool over USB.
; WIFI_SSID / WIFI_PASSWORD / STREAM_HOST_IP come from the shell environment,
; not from source — export them before `pio run` (see PLAN.md). Never commit
; real credentials into this file.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -DSTREAM_HOST_IP=\"${sysenv.STREAM_HOST_IP}\"

[env:unihiker]
; Stock camera FOV — GC2145_FOV_MODE left unset (defaults to 0 in main.cpp /
; ../../lib/gc2145wide/gc2145_wide.cpp).

; Wide-FOV test envs (see RESULTS.md in k10-camera-bench for measured tradeoffs).
[env:wide_fov]
build_flags =
    ${env.build_flags}
    -DGC2145_FOV_MODE=1   ; 720x960 portrait window, sensor 1/3

[env:sensor_1_4]
build_flags =
    ${env.build_flags}
    -DGC2145_FOV_MODE=2   ; 1280x960 landscape window, sensor 1/4

[env:sensor_full_1_5]
build_flags =
    ${env.build_flags}
    -DGC2145_FOV_MODE=3   ; full 1600x1200 sensor, 1/5

; upload_speed = 921600   ; uncomment/adjust if your cable supports it (default 115200)
