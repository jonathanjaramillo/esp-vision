; UNIHIKER K10 — FAST-9 corner detection (C/C++, PlatformIO + DFRobot framework-arduinounihiker)
;
; Build:   pio run
; Flash:   pio run -t upload        (USB-C; hold BOOT or press RST to force download mode if needed)
; Monitor: pio device monitor
;
; Camera: GC2145 QVGA (320x240) raw RGB565 via register_camera() — same wiring the
; framework's own display task uses, but with a queue owned by this project.
; Display: ILI9341 240x320 portrait via LVGL canvas (full-frame blit + HUD text per frame).
; No speech/AI model is flashed (no `Model` flag at all — do NOT add "-DModel=None").

[env:unihiker]
platform  = https://github.com/DFRobot/platform-unihiker.git
board     = unihiker_k10
framework = arduino

; Shared modules live in ../../lib (fastcorner, orb, k10image, k10stream) —
; PlatformIO auto-discovers anything under lib_extra_dirs the same way it
; does the project's own lib/.
lib_extra_dirs = ../../lib

; USB-CDC on boot so `Serial` maps to the USB-C port, flash via esptool over USB.
; WIFI_SSID / WIFI_PASSWORD / STREAM_HOST_IP come from the shell environment,
; not from source — export them before `pio run` (see PLAN.md). Never commit
; real credentials into this file.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -DSTREAM_HOST_IP=\"${sysenv.STREAM_HOST_IP}\"

; upload_speed = 921600   ; uncomment/adjust if your cable supports it (default 115200)
